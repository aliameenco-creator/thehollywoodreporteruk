name: Deploy to Hostinger

# Push to main (or run manually from the Actions tab) to lint, then copy the
# theme and both plugins to the Hostinger site.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   HOSTINGER_SSH_HOST  e.g. 123.45.67.89            (hPanel > Advanced > SSH Access)
#   HOSTINGER_SSH_PORT  e.g. 65002
#   HOSTINGER_SSH_USER  e.g. u123456789
#   HOSTINGER_SSH_KEY   private key whose public half is added in hPanel > SSH Access
#   HOSTINGER_WP_PATH   WordPress root, e.g. /home/u123456789/domains/<domain>/public_html
#
# Safety: the path is trimmed and validated, the job aborts unless WordPress is
# found at that path, and files are only ever added or updated, never deleted.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: PHP syntax check
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: JS syntax check
        run: node --check wp-content/themes/thr-theme/assets/js/main.js

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested in an `if` directly; expose whether they are set.
      HAS_SECRETS: ${{ secrets.HOSTINGER_SSH_KEY != '' && secrets.HOSTINGER_WP_PATH != '' }}
    steps:
      - name: Skip when Hostinger secrets are not configured
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Hostinger secrets not set yet; skipping deploy. See the comment at the top of deploy.yml."

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - name: Validate settings and configure SSH
        if: env.HAS_SECRETS == 'true'
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          RAW_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          RAW_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          RAW_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          RAW_PATH: ${{ secrets.HOSTINGER_WP_PATH }}
        run: |
          set -euo pipefail
          # Pasted secrets often carry a trailing newline or spaces; strip all whitespace.
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          HOST="$(clean "$RAW_HOST")"
          PORT="$(clean "${RAW_PORT:-65002}")"
          USER_NAME="$(clean "$RAW_USER")"
          WP_PATH="$(clean "$RAW_PATH")"
          WP_PATH="${WP_PATH%/}"

          if ! printf '%s' "$WP_PATH" | grep -Eq '^/home/[A-Za-z0-9_]+/domains/[A-Za-z0-9.-]+/public_html$'; then
            echo "::error::HOSTINGER_WP_PATH must look like /home/<user>/domains/<domain>/public_html"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

          # Refuse to touch anything unless this really is the WordPress root.
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" \
            "test -f '$WP_PATH/wp-config.php' && test -d '$WP_PATH/wp-content/themes' && test -d '$WP_PATH/wp-content/plugins'" \
            || { echo "::error::WordPress not found at HOSTINGER_WP_PATH; nothing was deployed."; exit 1; }

          {
            echo "DEPLOY_HOST=$HOST"
            echo "DEPLOY_PORT=$PORT"
            echo "DEPLOY_USER=$USER_NAME"
            echo "DEPLOY_PATH=$WP_PATH"
          } >> "$GITHUB_ENV"

      - name: Copy theme and plugins
        if: env.HAS_SECRETS == 'true'
        run: |
          set -euo pipefail
          RSH="ssh -i $HOME/.ssh/id_deploy -p $DEPLOY_PORT"
          # No --delete: files are only added or updated. Each target is an explicit subfolder.
          for dir in themes/thr-theme plugins/thr-core plugins/thr-importer; do
            rsync -rlz --chmod=D755,F644 -e "$RSH" "wp-content/$dir/" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/wp-content/$dir/"
          done

      - name: Flush rewrites and purge cache
        if: env.HAS_SECRETS == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && wp rewrite flush && (wp litespeed-purge all || true)"
